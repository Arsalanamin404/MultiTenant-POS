name: Deploy to AWS EC2
on:
  push:
    branches:
      - main


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Application
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/tenanttable-api:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/tenanttable-api:${{ github.sha }} .


      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/tenanttable-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/tenanttable-api:${{ github.sha }}

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "compose.prod.yaml"
          target: "~/MultiTenant-POS"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/MultiTenant-POS
            docker compose -f compose.prod.yaml pull
            docker compose -f compose.prod.yaml up -d --pull always --remove-orphans
            docker image prune -f
            
            for i in $(seq 1 15); do
            if curl --fail -s http://127.0.0.1:8080/api/v1/actuator/health; then
            echo "Healthy"
            exit 0
            fi
            echo "Waiting for app to be healthy... attempt $i"
            sleep 5
            done
            
            echo "App failed to become healthy — dumping logs:"
            docker logs tenanttable-api --tail 100
            exit 1